<!DOCTYPE html>
<html lang="ro">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pentru iubita mea ❤️</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

/* Ecranul cu butonul */

#startScreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* Butonul */

#startButton{

    padding:22px 50px;
    font-size:28px;

    border:none;
    border-radius:50px;

    background:#ff4f8b;
    color:white;

    cursor:pointer;

    transition:.3s;
}

#startButton:hover{

    transform:scale(1.08);

}

/* Videoclip */

video{

    display:none;

    width:100vw;
    height:100vh;

    object-fit:cover;

    opacity:1;

    transition:opacity 1s ease;

}

</style>

</head>

<body>

<div id="startScreen">

<button id="startButton">
❤️ Apasă pentru a vedea surpriza ❤️
</button>

</div>

<video id="intro" playsinline>

<source src="intro.mp4" type="video/mp4">

</video>



<script>

const button=document.getElementById("startButton");
const screen=document.getElementById("startScreen");
const video=document.getElementById("intro");

button.onclick=function(){

    localStorage.clear();
    
    screen.style.display="none";

    video.style.display="block";

    video.play();

}

video.onended=function(){

    video.style.opacity="0";

    setTimeout(function(){

        window.location.href="cause.html";

    },1000);

}

</script>

</body>

</html>
